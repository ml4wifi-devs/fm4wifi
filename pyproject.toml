[project]
name = "lai4wifi"
version = "0.1.0"
description = "Add your description here"

readme = "README.md"
license = {file = "LICENSE"}
keywords = []

authors = [
  {name = "Maksymilian Wojnar", email = "maksymilian.wojnar@agh.edu.pl"},
  {name = "Krzysztof Rusek", email = "krzysztof.rusek@agh.edu.pl"},
  {name = "Katarzyna Kosek-Szott", email = "katarzyna.kosek-szott@agh.edu.pl"},
  {name = "Szymon Szott", email = "szymon.szott@agh.edu.pl"},
]

requires-python = ">=3.12"
dependencies = [
    "evojax~=0.2.17",
    "hydra-core~=1.3.2",
    "jax-ai-stack~=2025.2.5",
    "jraph~=0.0.6.dev0",
    "lz4~=4.4.3",
    "mapc-sim~=0.1.12",
    "matplotlib~=3.10.1",
    "networkx~=3.4.2",
    "wandb~=0.19.8",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12_local]",
]

[tool.setuptools.packages]
find = {}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
