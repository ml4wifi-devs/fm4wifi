name: sur_medium
train_dataset_path: datasets/prebatched.pkl.lz4
val_dataset_path: datasets/prebatched_val.pkl.lz4
gnn_path: ../graphs/runs/gnn_b0.01_medium
model:
  gnn_layers: 3
  dim: 64
  ff_dim: 128
  n_layers: 3
  n_heads: 4
  n_components: 4
  drop_rate: 0.1
  dtype: float64
optimizer:
  learning_rate: 0.0005
  weight_decay: 0.01
  b1: 0.9
  b2: 0.999
  grad_clip: 1.0
train:
  ckpt:
    intermediate: false
    freq: 100
  log:
    type: wandb
    freq: 10
  val:
    n_steps: 10
    freq: 50
  batch_size: 32
  n_steps: 5000
  seed: 42
